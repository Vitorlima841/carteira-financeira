services:
  postgres:
    image: postgres:16-alpine
    container_name: carteira-financeira-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-carteira}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-carteira}
      POSTGRES_DB: ${DATABASE_NAME:-carteira_financeira}
    ports:
      - '5432:5432'
    volumes:
      - carteira-financeira-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-carteira}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carteira-financeira-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-carteira}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-carteira}
      DATABASE_NAME: ${DATABASE_NAME:-carteira_financeira}
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-troque-este-segredo-de-atualizacao}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
    ports:
      - '3000:3000'

volumes:
  carteira-financeira-data:
